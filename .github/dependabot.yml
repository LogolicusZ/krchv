version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      npm-all:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        versions: ["0.0.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-all:
        patterns:
          - "*"
