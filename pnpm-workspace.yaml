# Dependency build-script allowlist.
# pnpm 11+ reads `allowBuilds` (map); pnpm 10 reads `onlyBuiltDependencies` (list).
# Both kept so local (pnpm 10) and CI (pnpm 11) behave the same. Each version
# ignores the key it doesn't recognize.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
# Disable pnpm 11's default minimum release age gate, which rejected freshly
# published lockfile entries in CI. Read by both pnpm 10 and 11.
minimumReleaseAge: 0
overrides:
  "@eslint/eslintrc": 3.3.5
  dompurify: 3.4.13
  postcss: 8.5.26
